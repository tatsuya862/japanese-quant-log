<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="服や本などの持ち物を検索し、片づけ候補を整理できます。">
  <title>持ち物と片づけ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", "Times New Roman", serif;
      color: #292117;
      background: #f8f5ed;
      --muted: #63584b;
      --line: #ded5c4;
      --accent: #74500f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.6; }
    main { width: min(46rem, 100% - 2rem); margin-inline: auto; padding: 2rem 0 3rem; }
    header { margin-bottom: 1.4rem; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2rem, 8vw, 3.25rem); line-height: 1.3; }
    h2 { font-size: 1.16rem; overflow-wrap: anywhere; }
    header p { margin-top: 0.45rem; color: var(--muted); }
    label { display: grid; gap: 0.25rem; min-width: 0; }
    input, select, button {
      min-height: 2.8rem;
      font: inherit;
      color: inherit;
      border: 1px solid #988b77;
      border-radius: 0.35rem;
      padding: 0.45rem 0.65rem;
      background: #fff;
    }
    input, select { width: 100%; min-width: 0; }
    select {
      appearance: none;
      padding-right: 1.65rem;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 0.85rem) 50%, calc(100% - 0.6rem) 50%;
      background-size: 0.25rem 0.25rem;
      background-repeat: no-repeat;
    }
    button, summary { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .filters, .form-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(6.2rem, auto); gap: 0.65rem; }
    .form-fields label:last-child { grid-column: 1 / -1; }
    details {
      margin-top: 1rem;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 0.35rem;
    }
    summary { min-height: 2rem; padding: 0.2rem 0; font-weight: 700; }
    form { border-top: 1px solid var(--line); margin-top: 0.5rem; padding-top: 0.7rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.6rem; }
    .primary { background: #292117; color: #fff; border-color: #292117; }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; margin-top: 1.15rem; }
    .views button[aria-pressed="true"] { background: #292117; color: #fff; border-color: #292117; }
    #items { list-style: none; margin: 0.75rem 0 0; padding: 0; border-radius: 0.35rem; }
    #items > li { border-top: 1px solid var(--line); background: #fff; padding: 0.75rem 0.85rem; }
    #items > li:last-child { border-bottom: 1px solid var(--line); }
    .meta, .empty, #notice { color: var(--muted); overflow-wrap: anywhere; }
    .candidate { color: var(--accent); font-weight: 700; }
    .empty { margin-top: 0.6rem; padding: 0.75rem 0.85rem; border: 1px solid var(--line); }
    #notice:not(:empty), #undo:not([hidden]) { margin-top: 0.5rem; }
    #undo { margin-left: 0.25rem; }
    dialog { width: min(100% - 2rem, 27rem); border: 1px solid var(--line); border-radius: 0.35rem; color: inherit; padding: 1rem; }
    dialog::backdrop { background: #29211770; }
    dialog p { overflow-wrap: anywhere; margin-top: 0.5rem; }
  </style>
  <script src="belongings.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>持ち物と片づけ</h1>
      <p>買う前に、家にあるか検索。</p>
    </header>
    <div class="filters">
      <label for="search">持ち物を検索<input id="search" type="search" placeholder="名前や置き場所"></label>
      <label for="filter">分類
        <select id="filter"><option value="">すべて</option><option>服</option><option>本</option><option>その他</option></select>
      </label>
    </div>

    <details id="editor">
      <summary id="editor-title">持ち物を登録</summary>
      <form id="item-form">
        <div class="form-fields">
          <label for="name">持ち物の名前<input id="name" required maxlength="100" placeholder="例　黒のカーディガン"></label>
          <label for="category">分類
            <select id="category"><option>服</option><option>本</option><option>その他</option></select>
          </label>
          <label for="place">置き場所（任意）<input id="place" maxlength="100" placeholder="例　寝室のクローゼット"></label>
        </div>
        <div class="actions">
          <button class="primary" type="submit" id="submit-item">登録</button>
          <button type="button" id="cancel-edit" hidden>取り消す</button>
        </div>
        <p id="form-status" role="status"></p>
      </form>
    </details>

    <div class="views" role="group" aria-label="表示するリスト">
      <button type="button" id="all-view" aria-pressed="true" aria-controls="items">持ち物</button>
      <button type="button" id="candidate-view" aria-pressed="false" aria-controls="items">片づけ候補</button>
    </div>
    <p id="notice" role="status"></p>
    <button type="button" id="undo" hidden>元に戻す</button>
    <p class="empty" id="empty" hidden></p>
    <ul id="items" aria-label="持ち物リスト"></ul>

    <dialog id="remove-confirm" aria-labelledby="remove-title" aria-describedby="remove-detail">
      <h2 id="remove-title">手放しましたか？</h2>
      <p id="remove-detail"></p>
      <form method="dialog" class="actions">
        <button value="cancel" autofocus>戻る</button>
        <button class="primary" value="remove">手放した</button>
      </form>
    </dialog>
    <noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
  </main>
</body>
</html>
