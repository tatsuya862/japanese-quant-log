<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="長野の地上波番組表から、見たい番組と次の放送時間を確認できます。">
  <title>見たい番組リスト</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211b14;
      --muted: #61564b;
      --paper: #faf8f2;
      --gold: #795617;
      --line: #e0d8c8;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; }
    main { width: min(100% - 2rem, 46rem); margin-inline: auto; padding-block: 2rem 3rem; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.85rem, 7.5vw, 3rem); line-height: 1.3; font-weight: 600; }
    h2 { font-size: 1.4rem; }
    section { margin-top: 1.4rem; border: 1px solid var(--line); background: #fff; padding: clamp(0.9rem, 4vw, 1.6rem); }
    label { display: grid; gap: 0.2rem; min-width: 0; font-size: 0.95rem; }
    button, input, select {
      font: inherit;
      min-height: 2.85rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid #968673;
      border-radius: 0.35rem;
      color: var(--ink);
      background-color: #fff;
    }
    input, select { width: 100%; }
    select {
      appearance: none;
      padding-right: 1.8rem;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 0.9rem) 50%, calc(100% - 0.65rem) 50%;
      background-size: 0.25rem 0.25rem;
      background-repeat: no-repeat;
    }
    button { cursor: pointer; white-space: nowrap; }
    button:disabled { cursor: default; color: var(--muted); border-color: var(--line); background: var(--paper); }
    button:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 0.2em; }
    button, input, select, a { scroll-margin-block: 1rem; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    a { color: var(--gold); text-underline-offset: 0.2em; }
    .primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .add-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 0.5rem; margin-top: 1rem; }
    .heading, .row { display: flex; align-items: center; justify-content: space-between; gap: 0.65rem; }
    .heading { flex-wrap: wrap; }
    .row { padding-block: 0.7rem; border-top: 1px solid var(--line); }
    .row strong { display: block; overflow-wrap: anywhere; }
    .row button { flex: none; }
    .row-list { margin: 0; padding: 0; list-style: none; }
    .row-list:not(:empty) { margin-top: 0.65rem; }
    .examples { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }
    .examples:empty { display: none; }
    .examples button { border-color: var(--line); background: var(--paper); }
    .filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem; margin-block: 0.8rem; }
    .filters label:first-child { grid-column: 1 / -1; }
    .small { font-size: 0.9rem; color: var(--muted); }
    .small:empty { display: none; }
    .airing { display: block; color: var(--gold); font-size: 0.95rem; }
    #save-status:not(:empty), .source, #more { margin-top: 0.65rem; }
    #more { width: 100%; }
  </style>
  <script src="tv-watchlist.js" defer></script>
</head>
<body>
  <main>
    <h1>見たい番組リスト</h1>
    <section aria-labelledby="saved-title">
      <h2 id="saved-title">保存した番組</h2>
      <ul class="row-list" id="saved-list"></ul>
      <form class="add-form" id="add-form">
        <label for="new-title">番組名を追加
          <input id="new-title" maxlength="200" placeholder="例　旅番組の名前" required>
        </label>
        <button type="submit" class="primary">追加</button>
      </form>
      <div class="examples" id="examples" aria-label="番組名の例"></div>
      <p class="small" id="save-status" role="status"></p>
    </section>
    <section aria-labelledby="guide-title">
      <div class="heading">
        <h2 id="guide-title">長野の地上波番組表</h2>
        <button type="button" id="refresh">更新</button>
      </div>
      <p class="small" id="guide-status" role="status">番組表を取得しています…</p>
      <div class="filters">
        <label for="guide-search">番組名で検索
          <input type="search" id="guide-search" placeholder="番組名を入力">
        </label>
        <label for="guide-day">放送日
          <select id="guide-day"><option value="">今から先</option></select>
        </label>
        <label for="guide-channel">放送局
          <select id="guide-channel"><option value="">すべての局</option></select>
        </label>
      </div>
      <p class="small" id="guide-empty"></p>
      <ul class="row-list" id="guide-list"></ul>
      <button type="button" id="more" hidden>さらに表示</button>
      <p class="small source">データ提供 <a href="https://github.com/dbghelp/JCOM-TV-EPG" target="_blank" rel="noopener noreferrer">JCOM-TV-EPG</a> ・ <a href="https://tvguide.myjcom.jp/?area_id=10030" target="_blank" rel="noopener noreferrer">J:COMの番組表を見る</a></p>
    </section>
  </main>
</body>
</html>
